<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE8A3" stop-opacity="1" />
      <stop offset="40%" stop-color="#E8B4C8" stop-opacity="0.8" />
      <stop offset="80%" stop-color="#B8A9CD" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0B0B14" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <circle cx="32" cy="32" r="28" fill="url(#starGlow)" opacity="0.6"/>
  <!-- 4-point radiant star -->
  <path d="M32 6 C33 22 42 31 58 32 C42 33 33 42 32 58 C31 42 22 33 6 32 C22 31 31 22 32 6 Z" fill="#F5F0FF" filter="url(#glow)"/>
  <!-- Central soft heart -->
  <circle cx="32" cy="32" r="3.5" fill="#E8B4C8" />
</svg>
